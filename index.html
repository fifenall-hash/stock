<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금융 분석 차트 (PWA)</title>
    
    <!-- 아이콘 적용 -->
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    
    <meta name="theme-color" content="#121212">
    <!-- Chart.js 및 플러그인 (날짜 어댑터, 줌 플러그인) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --accent: #29b6f6;
            --accent-hover: #039be5;
        }
        body {
            margin: 0; padding: 20px;
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
        }
        .guide-banner {
            background-color: #2c2c2c; border-left: 4px solid #ff9100;
            padding: 15px; margin-bottom: 20px; border-radius: 4px;
        }
        .guide-banner a { color: var(--accent); text-decoration: none; }
        .guide-banner a:hover { text-decoration: underline; }
        
        .top-controls {
            display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap;
        }
        .top-metrics {
            display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
        }
        
        input[type="text"] {
            padding: 10px 15px; font-size: 16px; border: 1px solid #333;
            border-radius: 4px; background-color: #2a2a2a; color: white; outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        button {
            padding: 10px 20px; font-size: 16px; border: none; border-radius: 4px;
            cursor: pointer; font-weight: bold; transition: all 0.2s;
        }
        #search-btn { background-color: var(--accent); color: white; }
        #search-btn:hover { background-color: var(--accent-hover); }
        #toggle-btn { background-color: #4CAF50; color: white; }
        #toggle-btn.off { background-color: #555; color: #ccc; }
        #reset-zoom-btn { background-color: #757575; color: white; display: none; }
        #reset-zoom-btn:hover { background-color: #999; }
        
        .r2-display {
            font-size: 15px; font-weight: bold; color: #ffeb3b;
            padding: 8px 12px; background-color: #333; border-radius: 4px;
        }
        .loading { font-size: 14px; color: #ffeb3b; display: none; margin-left: 10px; }

        .main-content {
            display: flex; gap: 20px; flex: 1; min-height: 0;
        }
        .chart-container {
            flex: 3; background-color: var(--panel-bg);
            border-radius: 8px; padding: 15px; position: relative;
        }
        .indicator-container {
            flex: 1; background-color: var(--panel-bg);
            border-radius: 8px; padding: 15px; overflow-y: auto;
        }
        .indicator-group { margin-bottom: 20px; }
        .indicator-group h3 { margin-top: 0; font-size: 16px; color: var(--accent); border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .checkbox-label {
            display: flex; align-items: center; justify-content: space-between; 
            margin-bottom: 10px; cursor: pointer; color: #ddd; font-size: 14px;
            background: #2a2a2a; padding: 10px 10px; border-radius: 4px; transition: background 0.2s;
        }
        .checkbox-label:hover { background: #333; }
        .checkbox-main-group { display: flex; align-items: center; gap: 8px; width: 100%; }
        input[type="checkbox"] { cursor: pointer; transform: scale(1.1); margin-right: 5px; }
        
        .ind-text { display: inline-block; word-break: keep-all; }
        .err-text { color: #ff5252; font-size: 12px; margin-left: 5px; }
        
        /* 로그 뱃지 스타일 */
        .log-badge {
            font-size: 10px; font-weight: bold; background-color: #7e57c2; color: white;
            padding: 2px 5px; border-radius: 3px; margin-left: 6px; vertical-align: text-top;
        }
    </style>
</head>
<body>

    <div class="guide-banner" id="cors-guide">
        <h3 style="margin-top:0;">⚠️ 필독: 원활한 구동을 위한 초기 설정</h3>
        <p>이 앱은 브라우저에서 야후 파이낸스 및 연준(FRED) 서버의 데이터를 직접 수신합니다. 보안 정책(CORS) 우회를 위해 다음 설정이 필수입니다.</p>
        <ol style="margin-bottom:0;">
            <li>크롬 웹스토어에서 <a href="https://chromewebstore.google.com/detail/allow-cors-access-control/lhobafahddgcelffkeicbaginigeejlf" target="_blank">Allow CORS 확장프로그램</a>을 설치합니다.</li>
            <li>브라우저 우측 상단 확장프로그램 아이콘을 클릭해 <strong>ON 상태(컬러 아이콘)</strong>로 활성화합니다.</li>
            <li>설정이 완료되면 아래에 티커를 입력하고 검색해 주세요.</li>
        </ol>
    </div>

    <div class="top-controls">
        <input type="text" id="ticker-input" placeholder="티커 입력 (예: TQQQ)" value="TQQQ">
        <button id="search-btn">차트 검색</button>
        <button id="toggle-btn">추세선 기반 선형화: ON</button>
        <button id="reset-zoom-btn">줌 초기화</button>
        <span id="status-msg" class="loading">데이터 처리 중...</span>
    </div>
    
    <div class="top-metrics">
        <div id="r2-trend-display" class="r2-display" style="display:none;"></div>
        <div id="r2-main-display" class="r2-display" style="display:none;"></div>
    </div>

    <div class="main-content">
        <div class="chart-container">
            <canvas id="mainChart"></canvas>
        </div>
        <div class="indicator-container" id="indicator-panel">
            <!-- 체크박스 목록 자동 생성 -->
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW 등록 실패:', err));
        }

        // 지표 성격에 따라 로그/선형 스케일 사전 정의
        const INDICATORS = {
            'yahoo': [
                { id: 'DX-Y.NYB', name: '달러 인덱스', scale: 'linear' },
                { id: 'CL=F', name: 'WTI 원유 선물', scale: 'linear' },
                { id: 'HG=F', name: '구리 선물', scale: 'linear' },
                { id: '^IRX', name: '13주 만기 국채 금리', scale: 'linear' },
                { id: '^VXN', name: '나스닥 변동성 지수', scale: 'linear' },
                { id: 'BTC-USD', name: '비트코인', scale: 'log' }, // 장기 기하급수 성장
                { id: 'GC=F', name: '금 선물', scale: 'log' }      // 장기 우상향 인플레이션 반영
            ],
            'fred': [
                { id: 'DGS2', name: '2년물 국채 금리', scale: 'linear' },
                { id: 'BAMLH0A0HYM2', name: '하이일드 스프레드', scale: 'linear' },
                { id: 'WALCL', name: '연준 총자산 규모', scale: 'log' }, // 화폐 발행량 팽창
                { id: 'DFII10', name: '미국 10년물 실질 금리', scale: 'linear' }, // 음수 존재
                { id: 'T10Y2Y', name: '장단기 금리차', scale: 'linear' },          // 음수 존재
                { id: 'M2SL', name: 'M2 통화량', scale: 'log' },         // 지속적 유동성 팽창
                { id: 'STLFSI4', name: '금융스트레스 지수', scale: 'linear' }      // 음수 존재
            ]
        };
        const IND_COLORS = ['#00e676', '#29b6f6', '#ffea00', '#ff9100', '#f50057', '#d500f9', '#651fff', '#00b0ff', '#1de9b6'];

        let chartInstance = null;
        let mainData = [];       
        let trendData = [];      
        let detrendedData = [];  
        
        let trappedDaysArray = [];
        let validDataLength = 0; 
        
        let isDetrendedMode = true; 
        let cachedIndicators = {}; 
        let alignedIndicators = {}; 
        let activeTicker = "";

        function toYYYYMMDD(ms) {
            const d = new Date(ms);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        // 보조지표 UI 생성
        function initIndicatorsUI() {
            const panel = document.getElementById('indicator-panel');
            panel.innerHTML = '';
            
            ['yahoo', 'fred'].forEach(source => {
                const group = document.createElement('div');
                group.className = 'indicator-group';
                group.innerHTML = `<h3>${source === 'yahoo' ? '야후 파이낸스' : '미연준 (FRED)'}</h3>`;
                
                INDICATORS[source].forEach(ind => {
                    const isLog = ind.scale === 'log';
                    const logBadge = isLog ? `<span class="log-badge">LOG</span>` : '';
                    
                    const label = document.createElement('label');
                    label.className = 'checkbox-label';
                    label.innerHTML = `
                        <div class="checkbox-main-group">
                            <input type="checkbox" class="indicator-cb" value="${ind.id}" data-source="${source}" data-name="${ind.name}" data-scale="${ind.scale}"> 
                            <span class="ind-text" id="label-${ind.id.replace(/\W/g, '')}">${ind.name}${logBadge}</span>
                        </div>
                    `;
                    
                    label.querySelector('.indicator-cb').addEventListener('change', handleIndicatorToggle);
                    group.appendChild(label);
                });
                panel.appendChild(group);
            });
        }

        async function fetchYahoo(ticker) {
            const period1 = -2208988800; // 1900-01-01
            const period2 = Math.floor(Date.now() / 1000);
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?period1=${period1}&period2=${period2}&interval=1d`;
            
            const res = await fetch(url);
            if (!res.ok) throw new Error('Network response was not ok');
            const data = await res.json();
            
            const timestamps = data.chart.result[0].timestamp;
            const closes = data.chart.result[0].indicators.quote[0].close;
            let result = [];
            
            if (!timestamps || !closes) return result;
            
            for (let i = 0; i < timestamps.length; i++) {
                if (closes[i] !== null && closes[i] !== undefined) {
                    result.push({ x: timestamps[i] * 1000, y: closes[i] });
                }
            }
            return result;
        }

        async function fetchFred(ticker) {
            const url = `https://fred.stlouisfed.org/graph/fredgraph.csv?id=${ticker}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('Network response was not ok');
            const text = await res.text();
            
            const lines = text.trim().split('\n').slice(1);
            let result = [];
            for (let line of lines) {
                const [dateStr, valStr] = line.split(',');
                const val = parseFloat(valStr);
                if (!isNaN(val)) {
                    result.push({ x: new Date(dateStr).getTime(), y: val });
                }
            }
            return result;
        }

        function calculateTrend(data) {
            let n = data.length;
            if (n === 0) return { tData: [], dData: [] };
            
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
            let x0 = data[0].x; 
            
            for (let i = 0; i < n; i++) {
                let x = (data[i].x - x0) / 86400000;
                let y = Math.log(data[i].y);
                sumX += x; sumY += y; sumXY += x * y; sumX2 += x * x;
            }
            
            let m = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            let c = (sumY - m * sumX) / n;
            
            let tData = []; let dData = [];
            
            for (let i = 0; i < n; i++) {
                let x = (data[i].x - x0) / 86400000;
                let trendY = Math.exp(m * x + c);
                tData.push({ x: data[i].x, y: trendY });
                dData.push({ x: data[i].x, y: data[i].y / trendY });
            }
            return { tData, dData };
        }

        function calculateTrappedDays(data) {
            let n = data.length;
            let trapped = new Array(n).fill(0);
            
            for (let i = 0; i < n; i++) {
                let count = 0;
                let currentClose = data[i].y;
                for (let j = i + 1; j < n; j++) {
                    if (data[j].y < currentClose) count++;
                }
                trapped[i] = count;
            }
            
            let maxTrappedDays = Math.max(...trapped);
            let validLen = Math.max(0, n - maxTrappedDays);
            
            return { trapped, maxTrappedDays, validLen };
        }

        function calculateR2(arrX, arrY, validLen) {
            if(validLen < 2) return 0;
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0, sumY2 = 0;
            let count = 0;

            for(let i = 0; i < validLen; i++) {
                if(arrX[i] === null || arrY[i] === null || isNaN(arrX[i]) || isNaN(arrY[i])) continue;
                let x = arrX[i];
                let y = arrY[i];
                sumX += x; sumY += y; sumXY += x * y;
                sumX2 += x * x; sumY2 += y * y;
                count++;
            }
            
            if(count < 2) return 0;
            let num = (count * sumXY) - (sumX * sumY);
            let den = Math.sqrt((count * sumX2 - sumX*sumX) * (count * sumY2 - sumY*sumY));
            if(den === 0) return 0;
            let r = num / den;
            return r * r;
        }

        function alignIndicatorData(indData) {
            let map = new Map();
            for (let d of indData) {
                map.set(toYYYYMMDD(d.x), d.y);
            }

            let aligned = [];
            let lastVal = null;
            for (let d of mainData) {
                let dateStr = toYYYYMMDD(d.x);
                if (map.has(dateStr)) {
                    lastVal = map.get(dateStr);
                }
                aligned.push({ x: d.x, y: lastVal }); 
            }
            return aligned;
        }

        function updateMainR2Label() {
            const logPrice = mainData.map(d => Math.log(d.y));
            const logTrend = trendData.map(d => Math.log(d.y));
            const trendR2 = calculateR2(logPrice, logTrend, mainData.length);
            
            const trendR2Elem = document.getElementById('r2-trend-display');
            trendR2Elem.style.display = 'block';
            trendR2Elem.innerHTML = `주가 ↔ 지수추세선 (r²: ${trendR2.toFixed(4)})`;

            const detrendY = detrendedData.map(d => d.y);
            const mainR2 = calculateR2(detrendY, trappedDaysArray, validDataLength);
            
            const mainR2Elem = document.getElementById('r2-main-display');
            mainR2Elem.style.display = 'block';
            mainR2Elem.innerHTML = `종가/추세선 ↔ 물림일수 (r²: ${mainR2.toFixed(4)})`;
        }

        // 보조지표 r^2 라벨 직관적으로 업데이트 (vs 물림일수 명시)
        function updateIndicatorR2Label(cb) {
            const id = cb.value;
            const baseName = cb.dataset.name;
            const scale = cb.dataset.scale;
            const labelSpan = document.getElementById(`label-${id.replace(/\W/g, '')}`);
            
            const logBadge = scale === 'log' ? ` <span class="log-badge">LOG</span>` : '';

            if (alignedIndicators[id] && trappedDaysArray.length > 0) {
                const indY = alignedIndicators[id].map(d => d.y);
                const indR2 = calculateR2(indY, trappedDaysArray, validDataLength);
                
                labelSpan.innerHTML = `${baseName}${logBadge} (vs 물림일수 r²: ${indR2.toFixed(4)})`;
                labelSpan.style.color = '#ffeb3b';
            } else {
                labelSpan.innerHTML = `${baseName}${logBadge}`;
            }
        }

        document.getElementById('search-btn').addEventListener('click', async () => {
            const ticker = document.getElementById('ticker-input').value.trim();
            if (!ticker) return;
            activeTicker = ticker.toUpperCase();
            
            const status = document.getElementById('status-msg');
            status.textContent = "메인 차트 데이터 불러오는 중...";
            status.style.display = 'inline';
            
            try {
                mainData = await fetchYahoo(activeTicker);
                const calc = calculateTrend(mainData);
                trendData = calc.tData;
                detrendedData = calc.dData;
                
                const trapCalc = calculateTrappedDays(mainData);
                trappedDaysArray = trapCalc.trapped;
                validDataLength = trapCalc.validLen;

                document.getElementById('cors-guide').style.display = 'none'; 
                document.getElementById('reset-zoom-btn').style.display = 'inline-block';
                
                updateMainR2Label();
                updateChart();
                
                status.textContent = "보조지표 데이터 연동 및 r² 계산 중...";
                
                const fetchPromises = [];
                document.querySelectorAll('.indicator-cb').forEach(cb => {
                    const id = cb.value;
                    const source = cb.dataset.source;
                    
                    if (!cachedIndicators[id]) {
                        const p = (source === 'yahoo' ? fetchYahoo(id) : fetchFred(id))
                            .then(data => {
                                cachedIndicators[id] = data;
                                alignedIndicators[id] = alignIndicatorData(data);
                                updateIndicatorR2Label(cb);
                            })
                            .catch(err => {
                                console.error(`[${id}] 실패:`, err);
                                const labelSpan = document.getElementById(`label-${id.replace(/\W/g, '')}`);
                                labelSpan.innerHTML += ` <span class="err-text">(오류)</span>`;
                            });
                        fetchPromises.push(p);
                    } else {
                        alignedIndicators[id] = alignIndicatorData(cachedIndicators[id]);
                        updateIndicatorR2Label(cb);
                    }
                });

                await Promise.all(fetchPromises);
                
            } catch (err) {
                alert('데이터를 가져오지 못했습니다. 확장프로그램(Allow CORS)이 켜져 있는지 확인해 주세요.');
                console.error(err);
            } finally {
                status.style.display = 'none';
            }
        });

        const toggleBtn = document.getElementById('toggle-btn');
        toggleBtn.addEventListener('click', () => {
            isDetrendedMode = !isDetrendedMode;
            if (isDetrendedMode) {
                toggleBtn.textContent = '추세선 기반 선형화: ON';
                toggleBtn.classList.remove('off');
            } else {
                toggleBtn.textContent = '추세선 기반 선형화: OFF';
                toggleBtn.classList.add('off');
            }
            if (mainData.length > 0) updateChart();
        });

        document.getElementById('reset-zoom-btn').addEventListener('click', () => {
            if (chartInstance) {
                chartInstance.resetZoom();
            }
        });

        async function handleIndicatorToggle(e) {
            const cb = e.target;
            const id = cb.value;
            const source = cb.dataset.source;
            const status = document.getElementById('status-msg');

            if (cb.checked && !cachedIndicators[id]) {
                cb.disabled = true;
                status.textContent = "데이터 불러오는 중...";
                status.style.display = 'inline';
                try {
                    const rawData = source === 'yahoo' ? await fetchYahoo(id) : await fetchFred(id);
                    cachedIndicators[id] = rawData;
                    if(mainData.length > 0) {
                        alignedIndicators[id] = alignIndicatorData(rawData);
                        updateIndicatorR2Label(cb);
                    }
                } catch (err) {
                    alert(`[${id}] 데이터를 가져오는 중 오류가 발생했습니다.`);
                    cb.checked = false;
                } finally {
                    cb.disabled = false;
                    status.style.display = 'none';
                }
            }
            
            if (mainData.length > 0) updateChart();
        }

        const yearLinesPlugin = {
            id: 'yearLines',
            beforeDraw: (chart) => {
                const ctx = chart.ctx;
                const xAxis = chart.scales.x;
                const yAxis = chart.scales.y;
                const data = chart.data.datasets[0].data;
                if (!data || data.length === 0) return;

                ctx.save();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();

                for (let i = 1; i < data.length; i++) {
                    const prevYear = new Date(data[i-1].x).getFullYear();
                    const currYear = new Date(data[i].x).getFullYear();
                    
                    if (currYear > prevYear) {
                        const xPos = (xAxis.getPixelForValue(data[i-1].x) + xAxis.getPixelForValue(data[i].x)) / 2;
                        if (xPos >= xAxis.left && xPos <= xAxis.right) {
                            ctx.moveTo(xPos, yAxis.top);
                            ctx.lineTo(xPos, yAxis.bottom);
                        }
                    }
                }
                ctx.stroke();
                ctx.restore();
            }
        };

        function updateChart() {
            if (chartInstance) {
                chartInstance.destroy();
            }

            const datasets = [];
            const scales = {
                x: {
                    type: 'time',
                    time: { tooltipFormat: 'yyyy-MM-dd' },
                    grid: { color: 'rgba(255,255,255,0.1)', drawOnChartArea: false }, 
                    ticks: { color: '#aaa' }
                }
            };

            if (isDetrendedMode) {
                datasets.push({
                    label: `${activeTicker} 종가/추세선 비율`,
                    data: detrendedData,
                    borderColor: '#ffffff', borderWidth: 1.5, pointRadius: 0, yAxisID: 'y'
                });
                datasets.push({
                    label: '기준선 (1.0)',
                    data: [{ x: mainData[0].x, y: 1 }, { x: mainData[mainData.length - 1].x, y: 1 }],
                    borderColor: 'rgba(255, 255, 255, 0.4)', borderWidth: 1, borderDash: [2, 2], pointRadius: 0, yAxisID: 'y'
                });
                
                scales.y = {
                    type: 'linear', position: 'left',
                    grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#aaa' }
                };
            } else {
                datasets.push({
                    label: `${activeTicker} 종가 (로그)`,
                    data: mainData,
                    borderColor: '#ffffff', borderWidth: 1.5, pointRadius: 0, yAxisID: 'y'
                });
                datasets.push({
                    label: '지수 추세선',
                    data: trendData,
                    borderColor: '#ff5252', borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0, yAxisID: 'y'
                });
                
                scales.y = {
                    type: 'logarithmic', position: 'left',
                    grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#aaa' }
                };
            }

            let colorIndex = 0;
            document.querySelectorAll('.indicator-cb:checked').forEach(cb => {
                const id = cb.value;
                const baseName = cb.dataset.name;
                const scale = cb.dataset.scale; // HTML 속성에서 스케일 설정 가져오기

                if (alignedIndicators[id]) {
                    const yAxisID = 'y_' + id;
                    datasets.push({
                        label: baseName,
                        data: alignedIndicators[id], 
                        borderColor: IND_COLORS[colorIndex % IND_COLORS.length],
                        borderWidth: 1.5, pointRadius: 0, yAxisID: yAxisID
                    });
                    
                    scales[yAxisID] = {
                        type: scale, // 'logarithmic' 또는 'linear' 자동 적용
                        position: 'right', display: false 
                    };
                    colorIndex++;
                }
            });

            const ctx = document.getElementById('mainChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: scales,
                    plugins: {
                        legend: { labels: { color: '#fff' } },
                        tooltip: { backgroundColor: 'rgba(0,0,0,0.8)', titleColor: '#fff', bodyColor: '#fff' },
                        zoom: {
                            pan: { enabled: true, mode: 'x' },
                            zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }
                        }
                    }
                },
                plugins: [yearLinesPlugin] 
            });
        }

        initIndicatorsUI();
    </script>
</body>
</html>
